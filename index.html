function renderRearrangeBody() {
  const data = loadData();
  const R = rearrangeState;
  const host = $('#rearrangeBody');
  if (!host) return;
  if (!data.storages.length) { host.innerHTML = '<p class="muted">Create at least one storage first.</p>'; return; }
  const storageSelect = (field, value) =>
    '<select data-rf="' + field + '">' +
      data.storages.map(s => '<option value="' + esc(s.id) + '"' + (s.id === value ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') +
    '</select>';
  const slotSelect = (storageId, selected, extraAttr) =>
    '<select ' + (extraAttr || '') + '>' +
      '<option value="">— choose slot —</option>' +
      data.slots.filter(s => s.storage_id === storageId).map(s =>
        '<option value="' + esc(s.id) + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.label) + '</option>').join('') +
    '</select>';
  if (!R.fromId) R.fromId = data.storages[0].id;
  if (!R.toId) R.toId = (data.storages[1] || data.storages[0]).id;
  if (!R.swapA) R.swapA = data.storages[0].id;
  if (!R.swapB) R.swapB = (data.storages[1] || data.storages[0]).id;
  if (!R.pickSourceId) R.pickSourceId = data.storages[0].id;
  if (!R.pickPickStorageId) R.pickPickStorageId = (data.storages[1] || data.storages[0]).id;
  let controls = '';
  if (R.mode === 'moveAll') {
    const sourceSlots = data.slots.filter(s => s.storage_id === R.fromId);
    let manualRows = '';
    if (R.mapping === 'manual') {
      manualRows = sourceSlots.map(s =>
        '<div class="result-row"><span>' + esc(s.label) + '</span>' +
          slotSelect(R.toId, R.manualMap[s.id] || '', 'data-rf="manual:' + esc(s.id) + '"') + '</div>').join('');
    }
    controls =
      '<div class="form-grid">' +
        '<div class="field"><label>From storage</label>' + storageSelect('fromId', R.fromId) + '</div>' +
        '<div class="field"><label>To storage</label>' + storageSelect('toId', R.toId) + '</div>' +
        '<div class="field span2"><label>Slot mapping</label>' +
          '<select data-rf="mapping">' +
            '<option value="same"' + (R.mapping === 'same' ? ' selected' : '') + '>Same slot names automatically</option>' +
            '<option value="single"' + (R.mapping === 'single' ? ' selected' : '') + '>Everything into one slot</option>' +
            '<option value="manual"' + (R.mapping === 'manual' ? ' selected' : '') + '>Choose manually per slot</option>' +
          '</select></div>' +
        ((R.mapping === 'single' || R.mapping === 'same')
          ? '<div class="field span2"><label>' + (R.mapping === 'single' ? 'Destination slot' : 'Fallback slot') + '</label>' +
            slotSelect(R.toId, R.singleSlotId, 'data-rf="singleSlotId"') + '</div>' : '') +
        (manualRows ? '<div class="field span2"><label>Slot mapping</label>' + manualRows + '</div>' : '') +
      '</div>';

        '<span style="display:flex;gap:8px;align-items:center">' +

    }).join('');
    controls =
      '<div class="form-grid">' +
        '<div class="field"><label>Source storage</label>' + storageSelect('pickSourceId', R.pickSourceId) + '</div>' +
        '<div class="field"><label>Destination storage</label>' + storageSelect('pickPickStorageId', R.pickPickStorageId) + '</div>' +
        '<div class="field span2"><label>Destination slot</label>' + slotSelect(R.pickPickStorageId, R.pickSlotId, 'data-rf="pickSlotId"') + '</div>' +
        '<div class="field span2"><label>Tick the batches to move</label>' +

    return '<tr>' +

      '<input id="rearrangeReason" placeholder="e.g. Fridge maintenance" value="' + esc(R.reason) + '"></div>';
}

function buildRearrangePlan(data) {
  const R = rearrangeState;
  const rows = [];
  const warnings = [];
  let error = '';
  const slotOf = id => data.SL[id] || null;
  const storageOfSlot = slotId => { const s = data.SL[slotId]; return s ? data.S[s.storage_id] : null; };
  const slotsOfStorage = storageId => data.slots.filter(s => s.storage_id === storageId);
  const batchesInStorage = storageId => {
    const ids = slotsOfStorage(storageId).map(s => s.id);
    return data.batches.filter(b => b.quantity > 0 && ids.includes(b.slot_id));
  };
  const matchLabel = (storageId, label) => {
    const found = slotsOfStorage(storageId).find(s => String(s.label).toLowerCase() === String(label).toLowerCase());
    return found ? found.id : null;
  };
  const firstSlot = storageId => { const s = slotsOfStorage(storageId)[0]; return s ? s.id : null; };
  if (R.mode === 'moveAll') {
    if (R.fromId === R.toId) return { rows, warnings, error: 'Source and destination must be different.' };
    const source = batchesInStorage(R.fromId);
    if (!source.length) return { rows, warnings, error: 'The source storage has no stock to move.' };
    for (const b of source) {
      const fromSlot = slotOf(b.slot_id);
      let toSlotId = null;
      if (R.mapping === 'single') toSlotId = R.singleSlotId || null;
      else if (R.mapping === 'same') toSlotId = (fromSlot ? matchLabel(R.toId, fromSlot.label) : null) || R.singleSlotId || null;
      else toSlotId = R.manualMap[b.slot_id] || null;
      rows.push({ batchId: b.id, fromSlotId: b.slot_id, toSlotId });
    }
    if (rows.some(r => !r.toSlotId)) error = 'Every source slot needs a destination slot.';
  }
  if (R.mode === 'swap') {
    if (R.swapA === R.swapB) return { rows, warnings, error: 'Choose two different storages.' };
    const a = batchesInStorage(R.swapA), b = batchesInStorage(R.swapB);
    if (!a.length && !b.length) return { rows, warnings, error: 'Both storages are empty.' };
    a.forEach(batch => {
      const fromSlot = slotOf(batch.slot_id);
      const toSlotId = (fromSlot ? matchLabel(R.swapB, fromSlot.label) : null) || firstSlot(R.swapB);
      rows.push({ batchId: batch.id, fromSlotId: batch.slot_id, toSlotId });
    });
    b.forEach(batch => {
      const fromSlot = slotOf(batch.slot_id);
      const toSlotId = (fromSlot ? matchLabel(R.swapA, fromSlot.label) : null) || firstSlot(R.swapA);
      rows.push({ batchId: batch.id, fromSlotId: batch.slot_id, toSlotId });
    });
    if (rows.some(r => !r.toSlotId)) error = 'One of the storages has no slots to move into.';
  }
  if (R.mode === 'pick') {
    if (!R.pickBatchIds.length) return { rows, warnings, error: 'Tick at least one batch to move.' };
    if (!R.pickSlotId) return { rows, warnings, error: 'Choose a destination slot.' };
    const sourceSlotIds = slotsOfStorage(R.pickSourceId).map(s => s.id);
    R.pickBatchIds.forEach(id => {
      const batch = data.B[id];
      if (!batch || batch.quantity <= 0) return;
      if (!sourceSlotIds.includes(batch.slot_id)) return;
      rows.push({ batchId: batch.id, fromSlotId: batch.slot_id, toSlotId: R.pickSlotId });
    });
    if (!rows.length) error = 'The selected batches are no longer in the selected source storage.';
  }
  const finalRows = rows.filter(r => r.toSlotId && r.toSlotId !== r.fromSlotId);
  if (!error && !finalRows.length && rows.length) error = 'Nothing would actually change — the items are already in those slots.';
  finalRows.forEach(r => {
    const batch = data.B[r.batchId];
    if (!batch) return;
    const product = data.P[batch.product_id];
    const dest = storageOfSlot(r.toSlotId);
    if (!product || !dest) return;
    if (product.storage_req === 'cold' && dest.type !== 'cold') {
      warnings.push(product.brand_name + ' (' + batch.batch_no + ') needs cold storage but "' + dest.name + '" is ' + (STORAGE_LABELS[dest.type] || 'Unknown') + '.');
    }
    if (product.storage_req === 'restricted' && dest.type !== 'restricted') {
      warnings.push(product.brand_name + ' (' + batch.batch_no + ') is restricted but "' + dest.name + '" is not a restricted storage.');
    }
  });
  return { rows: finalRows, warnings, error };
}

function renderHistory(panel, data) {
  const f = ui.history;
  const q = f.search.trim().toLowerCase();
  let rows = data.movements.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (f.type !== 'all') rows = rows.filter(m => m.type === f.type);
  if (f.from) rows = rows.filter(m => String(m.created_at).slice(0, 10) >= f.from);
  if (f.to)   rows = rows.filter(m => String(m.created_at).slice(0, 10) <= f.to);
  if (q) {
    rows = rows.filter(m => {
      const batch = data.B[m.batch_id];
      const product = batch ? data.P[batch.product_id] : null;
      const productName = batch ? (product ? product.brand_name : '(deleted product)') : '(deleted batch)';
      return [productName, batch ? batch.batch_no : '', m.reason || ''].join(' ').toLowerCase().includes(q);
    });
  }
  const totalMatches = rows.length;
  const totalPages = Math.max(1, Math.ceil(totalMatches / HISTORY_PAGE_SIZE));
  if (f.page > totalPages) f.page = totalPages;
  if (f.page < 1) f.page = 1;
  const startIdx = (f.page - 1) * HISTORY_PAGE_SIZE;
  const pageRows = rows.slice(startIdx, startIdx + HISTORY_PAGE_SIZE);
  const bodyRows = pageRows.map(m => {
    const batch = data.B[m.batch_id];
    const product = batch ? data.P[batch.product_id] : null;
    const productName = batch ? (product ? product.brand_name : '(deleted product)') : '(deleted batch)';
    const batchNo = batch ? batch.batch_no : '—';
    const qtyText = m.type === 'adjusted' ? (m.quantity > 0 ? '+' : '') + m.quantity : String(m.quantity);
    let location = '';
    if (m.type === 'moved') location = slotFullLabel(data, m.from_slot_id) + ' → ' + slotFullLabel(data, m.to_slot_id);
    else if (m.to_slot_id && !m.from_slot_id) location = slotFullLabel(data, m.to_slot_id);
    else if (m.from_slot_id) location = slotFullLabel(data, m.from_slot_id);
    if (m.reason) location += (location ? ' · ' : '') + m.reason;
    const typeClass = {
      received:'badge-green', sold:'badge-blue', written_off:'badge-red',
      moved:'badge-yellow', voided:'badge-gray', adjusted:'badge-gray'
    }[m.type] || 'badge-gray';
    return '<tr>' +
      '<td class="nowrap">' + esc(fmtDateTime(m.created_at)) + '</td>' +
      '<td>' + esc(productName) + '</td>' +
      '<td>' + esc(batchNo) + '</td>' +
      '<td><span class="badge ' + typeClass + '">' + esc(MOVEMENT_LABELS[m.type] || 'Unknown') + '</span></td>' +
      '<td class="right">' + esc(qtyText) + '</td>' +
      '<td class="small">' + esc(location || '—') + '</td></tr>';
  }).join('');
  const typeOptions = ['all'].concat(Object.keys(MOVEMENT_LABELS)).map(t =>
    '<option value="' + t + '"' + (f.type === t ? ' selected' : '') + '>' +
    (t === 'all' ? 'All types' : (MOVEMENT_LABELS[t] || 'Unknown')) + '</option>').join('');
  const chips = [];
  if (f.type !== 'all') chips.push(chipMarkup(MOVEMENT_LABELS[f.type] || 'Unknown', 'hist-chip', 'type'));
  if (f.from) chips.push(chipMarkup('From: ' + f.from, 'hist-chip', 'from'));
  if (f.to)   chips.push(chipMarkup('To: ' + f.to, 'hist-chip', 'to'));
  if (f.search) chips.push(chipMarkup('Search: "' + f.search + '"', 'hist-chip', 'search'));
  const chipsHtml = chips.length
    ? '<div class="chips">' + chips.join('') + '<button class="btn sm" data-act="hist-clear" type="button">Clear filters</button></div>'
    : '';
  const paginationHtml = totalMatches > HISTORY_PAGE_SIZE
    ? '<div class="pagination">' +
        '<button class="btn sm" data-act="hist-page" data-page="' + (f.page - 1) + '"' + (f.page <= 1 ? ' disabled' : '') + '><i class="ph ph-caret-left"></i> Prev</button>' +
        '<span class="pg-info">Page ' + f.page + ' of ' + totalPages + '</span>' +
        '<button class="btn sm" data-act="hist-page" data-page="' + (f.page + 1) + '"' + (f.page >= totalPages ? ' disabled' : '') + '>Next <i class="ph ph-caret-right"></i></button>' +
      '</div>'
    : '';
  panel.innerHTML =
    '<div class="page-head"><div><h2>History</h2><p class="muted" style="margin:0">Read-only movement log.</p></div>' +
      '<div class="row">' +
        '<button class="btn sm filters-toggle" data-act="hist-filters-toggle" type="button" aria-expanded="' + (f.showFilters ? 'true' : 'false') + '"><i class="ph ph-funnel"></i> Filters</button>' +
        '<button class="btn" data-act="export-csv" type="button"><i class="ph ph-download-simple"></i> Export CSV</button>' +
      '</div>' +
      '<div class="row filters-bar' + (f.showFilters ? ' open' : '') + '" style="flex:1 1 100%">' +
        '<input id="histSearch" class="search" placeholder="Search product / batch / reason…" value="' + esc(f.search) + '">' +
        '<select id="histType" style="width:auto">' + typeOptions + '</select>' +
        '<input id="histFrom" type="date" value="' + esc(f.from) + '" aria-label="From date">' +
        '<input id="histTo" type="date" value="' + esc(f.to) + '" aria-label="To date">' +
      '</div>' +
    '</div>' + chipsHtml +
    (totalMatches ? '<div class="result-count">Showing ' + Math.min(HISTORY_PAGE_SIZE, pageRows.length) +
      ' of ' + totalMatches + ' records (page ' + f.page + ' of ' + totalPages + ')</div>' : '') +
    '<div class="table-wrap">' +
      (bodyRows
        ? '<table><thead><tr><th>Date / time</th><th>Product</th><th>Batch</th><th>Type</th>' +
          '<th class="right">Qty</th><th>Location / reason</th></tr></thead><tbody>' + bodyRows + '</tbody></table>'
        : '<div class="empty">' +
            (data.movements.length
              ? 'No movements match the current filters. <button class="btn sm" data-act="hist-clear" type="button">Clear filters</button>'
              : 'No movements yet — receive some stock to get started.') +
          '</div>') +
    '</div>' + paginationHtml;
}

        '<div class="field span2"><label for="setCurrentPassword">Current Password *</label>' +
          '<input id="setCurrentPassword" type="password" autocomplete="current-password" placeholder="Required only when changing credentials"></div>' +
        '<div class="field"><label for="setUsername">New Username</label><input id="setUsername" autocomplete="off" placeholder="Leave blank to keep current"></div>' +
        '<div class="field"><label for="setPassword">New Password</label><input id="setPassword" type="password" autocomplete="new-password" placeholder="Leave blank to keep current"></div>' +
        '<div class="field"><label for="setPasswordConfirm">Confirm New Password</label><input id="setPasswordConfirm" type="password" autocomplete="new-password"></div>' +
      '</div>' +
      '<div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--border)">' +
        '<button class="btn primary" data-act="settings-save" type="button" style="width:auto;">Save settings</button>' +
      '</div>' +
    '</div>';
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */

document.addEventListener('click', event => {
  const btn = event.target.closest('[data-act]');
  if (!btn) return;
  handleAction(btn.dataset.act, btn.dataset.id, btn);
});

function handleAction(action, id, el) {
  switch (action) {
    case 'toggle-theme': toggleTheme(); break;
    case 'modal-close': closeModal(); break;
    case 'data-menu-toggle': {
      const menu = $('#dataMenu');
      const btn = $('#dataMenuBtn');
      const isOpen = !menu.hidden;
      menu.hidden = isOpen;
      btn.setAttribute('aria-expanded', String(!isOpen));
      if (!isOpen) {
        positionMenu(menu, btn);
        const closeOnOutside = e => {
          if (!menu.contains(e.target) && e.target !== btn) {
            menu.hidden = true;
            btn.setAttribute('aria-expanded', 'false');
            document.removeEventListener('click', closeOnOutside);
          }
        };
        setTimeout(() => document.addEventListener('click', closeOnOutside), 0);
      }
      break;
    }
    case 'export-backup': closeDataMenu(); exportBackup(); break;
    case 'import-backup': closeDataMenu(); $('#importFile').click(); break;
    case 'logout': clearSession(); showAuthScreen(); break;

    /* ---- Onboarding ---- */
    case 'open-setup': openSetupModal(); break;
    case 'setup-skip':
      try {
        db.transaction(state => { state.meta = Object.assign({}, state.meta || {}, { onboarded: true }); });
        closeModal();
        toast('You can complete your pharmacy profile anytime in Settings.', 'info');
        render();
      } catch (err) { toast(err.message, 'error'); }
      break;
    case 'setup-save': {
      clearFieldErrors();
      const name = ($('#setupName').value || '').trim();
      const address = ($('#setupAddress').value || '').trim();
      const phone = ($('#setupPhone').value || '').trim();
      const symbol = ($('#setupCurrencySymbol').value || '').trim();
      let bad = false;
      if (!name) { setFieldError('setupName','Pharmacy name is required.'); bad = true; }
      if (!symbol) { setFieldError('setupCurrencySymbol','Currency symbol is required.'); bad = true; }
      if (bad) { focusFirstInvalid(); return; }
      try {
        db.transaction(state => {
          state.settings = Object.assign({}, state.settings, {
            pharmacy_name: name, pharmacy_address: address, pharmacy_phone: phone, currency_symbol: symbol
          });
          state.meta = Object.assign({}, state.meta || {}, { onboarded: true });
        });
        closeModal();
        toast('Pharmacy profile saved.', 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'onboarding-create-storage': openStorageModal(null); break;
    case 'onboarding-create-product': openProductModal(null); break;
    case 'go-storage':  ui.tab = 'storage'; render(); blinkTab('storage'); break;
    case 'go-products': ui.tab = 'products'; render(); blinkTab('products'); break;
    case 'go-receive':  ui.tab = 'stock'; ui.stockTab = 'receive'; render(); blinkTab('stock'); break;
    case 'go-sale':     ui.tab = 'sales'; ui.sale.subTab = 'new'; render(); blinkTab('sales'); break;
    case 'go-help':     ui.tab = 'help'; render(); break;

    /* Navigate to a tab from the Help guide, unlock it, then blink. */
    case 'go-tab': {
      const target = el.dataset.target;
      if (!target || !PANELS.includes(target)) break;
      const data = loadData();
      const step = isTutorialMode(data) ? getOnboardingStep(data) : null;
      if (step && step.tab === target) {
        _tutorialOpenedStep = Math.max(_tutorialOpenedStep, step.idx);
      }
      ui.tab = target;
      render();
      blinkTab(target);
      break;
    }

    case 'dash-filter': {
      const data = loadData();
      if (isTutorialMode(data)) { tutorialLockToast(); break; }
      ui.inv.status = el.dataset.status;
      ui.tab = 'inventory';
      render();
      break;
    }
    case 'wo-quick': {
      const data = loadData();
      const step = isTutorialMode(data) ? getOnboardingStep(data) : null;
      if (step && !isTabUnlocked('stock', step)) { tutorialLockToast(); break; }
      ui.woBatchId = id; ui.woSearch = ''; ui.tab = 'stock'; ui.stockTab = 'writeoff'; render();
      { const qty = $('#woQty'); if (qty) qty.focus(); }
      break;
    }

    /* ---- Products ---- */
    case 'product-new': openProductModal(null); break;
    case 'product-edit': openProductModal(id); break;
    case 'product-clear': ui.productSearch = ''; render(); break;
    case 'product-sort': {
      const key = el.dataset.sort;
      const cur = ui.products.sort || '';
      const curBase = cur.replace(/-asc$|-desc$/, '');
      if (curBase === key && cur.endsWith('-asc')) ui.products.sort = key + '-desc';
      else ui.products.sort = key + '-asc';
      render();
      break;
    }
    case 'product-save': {
      clearFieldErrors();
      const brand = $('#pfBrand').value.trim();
      const generic = $('#pfGeneric').value.trim();
      const strength = $('#pfStrength').value.trim();
      const form = $('#pfForm').value;
      const price = parseFloat($('#pfPrice').value);
      const minStock = parseInt($('#pfMin').value, 10);
      const storageReq = $('#pfStorage').value;
      let bad = false;
      if (!brand) { setFieldError('pfBrand','Brand name is required.'); bad = true; }
      if (!form || !FORM_LABELS[form]) { setFieldError('pfForm','Please choose a valid form.'); bad = true; }
      if (isNaN(price) || price < 0) { setFieldError('pfPrice','Price must be zero or more.'); bad = true; }
      if (isNaN(minStock) || minStock < 0) { setFieldError('pfMin','Minimum stock must be zero or more.'); bad = true; }
      if (bad) { focusFirstInvalid(); return; }
      const payload = { brand_name: brand, generic_name: generic, strength, form, price: round2(price), min_stock: minStock, storage_req: storageReq };
      try {
        if (id) db.update('products', id, payload);
        else db.add('products', payload);
        closeModal();
        toast('Product saved.', 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'product-del': {
      const data = loadData();
      const used = data.batches.filter(b => b.product_id === id && b.quantity > 0);
      if (used.length) return toast('Cannot delete: ' + used.length + ' active batch(es) still reference this product. Write off or delete the batch first.', 'error');
      const p = data.P[id];
      confirmDialog('Delete "' + (p ? p.brand_name : 'this product') + '"?', () => {
        try {
          db.transaction(state => {
            state.products = state.products.filter(x => x.id !== id);
            state.batches = state.batches.filter(b => b.product_id !== id);
            // If every product is gone, restart onboarding automatically.
            if (state.products.length === 0 && state.meta) {
              state.meta.checklist_dismissed = false;
            }
          });
          toast('Product deleted.', 'success');
          render();
        }
        catch (err) { toast(err.message, 'error'); }
      }, { title: 'Delete product', confirmText: 'Delete' });
      break;
    }

    /* ---- Batches ---- */
    case 'batch-edit': openBatchModal(id); break;
    case 'batch-save': {
      const data = loadData();
      const old = data.B[id];
      if (!old) return toast('Batch not found.', 'error');
      clearFieldErrors();
      const productId = $('#bfProduct').value;
      const batchNo = $('#bfBatchNo').value.trim();
      const expiry = $('#bfExpiry').value;
      const qty = parseInt($('#bfQty').value, 10);
      const supplier = $('#bfSupplier').value.trim();
      const slotId = $('#bfSlot').value;
      let bad = false;
      if (!productId) { setFieldError('bfProduct','Product is required.'); bad = true; }
      if (!batchNo) { setFieldError('bfBatchNo','Batch number is required.'); bad = true; }
      if (!expiry || !isValidDate(expiry)) { setFieldError('bfExpiry','Please enter a valid expiry date.'); bad = true; }
      if (isNaN(qty) || qty < 0) { setFieldError('bfQty','Quantity must be zero or more.'); bad = true; }
      if (!slotId) { setFieldError('bfSlot','Storage slot is required.'); bad = true; }
      const product = data.P[productId];
      const slot = data.SL[slotId];
      const storage = slot ? data.S[slot.storage_id] : null;
      if (!product) { setFieldError('bfProduct','The selected product no longer exists. Choose another product.'); bad = true; }
      if (!slot || !storage) { setFieldError('bfSlot','Storage slot is invalid.'); bad = true; }
      if (product && storage && product.storage_req === 'restricted' && storage.type !== 'restricted') {
        setFieldError('bfSlot','Restricted products may only be stored in restricted storage.'); bad = true;
      }
      const duplicate = data.batches.find(b => b.id !== id && b.product_id === productId && String(b.batch_no).toLowerCase() === batchNo.toLowerCase() && b.expiry_date === expiry);
      if (duplicate) { setFieldError('bfBatchNo','Another batch with the same product, batch no. and expiry already exists.'); bad = true; }
      if (bad) { focusFirstInvalid(); return; }
      const qtyChanged = qty !== old.quantity;
      const slotChanged = slotId !== old.slot_id;
      const saveBatch = () => {
        try {
          db.transaction(state => {
            const batch = state.batches.find(b => b.id === id);
            if (!batch) throw new Error('Batch not found.');
            batch.product_id = productId; batch.batch_no = batchNo; batch.expiry_date = expiry;
            batch.quantity = qty; batch.supplier = supplier; batch.slot_id = slotId;
            const now = new Date().toISOString();
            if (qtyChanged) {
              db.insertInto(state, 'movements', {
                batch_id: batch.id, type:'adjusted', quantity: qty - old.quantity,
                reason: 'Manual correction', from_slot_id: null, to_slot_id: null, created_at: now
              });
            }
            if (slotChanged) {
              db.insertInto(state, 'movements', {
                batch_id: batch.id, type:'moved', quantity: qty,
                reason: 'Manual correction', from_slot_id: old.slot_id, to_slot_id: slotId, created_at: now
              });
            }
          });
          closeModal();
          toast('Batch updated.', 'success');
          render();
        } catch (err) { toast(err.message, 'error'); }
      };
      if (product && storage && product.storage_req === 'cold' && storage.type !== 'cold') {
        confirmDialog(
          product.brand_name + ' requires cold storage, but "' + storage.name + '" is ' + (STORAGE_LABELS[storage.type] || 'Unknown') + '. Save anyway?',
          saveBatch, { title: 'Cold chain warning', confirmText: 'Save anyway' }
        );
        return;
      }
      saveBatch();
      break;
    }
    case 'batch-del': {
      const data = loadData();
      const b = data.B[id];
      if (!b) return;
      const hasQty = Number(b.quantity) > 0;
      if (hasQty) {
        confirmDialog(
          'Batch ' + b.batch_no + ' still holds ' + b.quantity + ' unit(s). Use Write-off to clear it first.',
          () => { ui.tab = 'stock'; ui.stockTab = 'writeoff'; ui.woBatchId = id; ui.woSearch = ''; render(); },
          { title: 'Cannot delete batch', confirmText: 'Go to Write-off', danger: false }
        );
        return;
      }
      confirmDialog('Delete batch ' + b.batch_no + '? Its movement history will remain in History and show "(deleted batch)".', () => {
        try { db.remove('batches', id); toast('Batch deleted.', 'success'); render(); }
        catch (err) { toast(err.message, 'error'); }
      }, { title: 'Delete batch', confirmText: 'Delete' });
      break;
    }

    /* ---- Inventory ---- */
    case 'inv-sort-header': {
      const s = el.dataset.sort;
      if (s === 'product') ui.inv.sort = 'product';
      else if (s === 'expiry') ui.inv.sort = (ui.inv.sort === 'expiry-asc') ? 'expiry-desc' : 'expiry-asc';
      else if (s === 'qty') ui.inv.sort = (ui.inv.sort === 'qty-desc') ? 'product' : 'qty-desc';
      render();
      break;
    }
    case 'inv-chip': {
      const field = el.dataset.field;
      if (field === 'status') ui.inv.status = 'all';
      else if (field === 'storage') ui.inv.storage = 'all';
      else if (field === 'search') ui.inv.search = '';
      else if (field === 'showZero') ui.inv.showZero = false;
      render();
      break;
    }
    case 'inv-clear':
      ui.inv = { search:'', status:'all', storage:'all', sort:'expiry-asc', showZero:false, showFilters: ui.inv.showFilters };
      render();
      break;
    case 'inv-filters-toggle': ui.inv.showFilters = !ui.inv.showFilters; render(); break;

    /* ---- History ---- */
    case 'hist-chip': {
      const field = el.dataset.field;
      if (field === 'type') ui.history.type = 'all';
      else if (field === 'from') ui.history.from = '';
      else if (field === 'to') ui.history.to = '';
      else if (field === 'search') ui.history.search = '';
      ui.history.page = 1;
      render();
      break;
    }
    case 'hist-clear': ui.history = { type:'all', from:'', to:'', search:'', page:1, showFilters: ui.history.showFilters }; render(); break;
    case 'hist-filters-toggle': ui.history.showFilters = !ui.history.showFilters; render(); break;
    case 'hist-page': ui.history.page = parseInt(el.dataset.page, 10) || 1; render(); break;

    /* ---- Sales ---- */
    case 'sale-subtab': ui.sale.subTab = el.dataset.tab; render(); break;
    case 'sale-add': {
      const data = loadData();
      const qtyInput = document.getElementById('qty-' + id);
      const qty = parseInt(qtyInput ? qtyInput.value : '', 10);
      if (!qty || qty <= 0 || isNaN(qty)) return toast('Enter a quantity of 1 or more.', 'error');
      const available = productStock(data, id);
      const existing = ui.sale.cart.find(c => c.productId === id);
      const alreadyInCart = existing ? existing.qty : 0;
      if (qty + alreadyInCart > available) return toast('Only ' + available + ' non-expired unit(s) available.', 'error');
      if (existing) existing.qty += qty;
      else ui.sale.cart.push({ productId: id, qty });
      render();
      break;
    }
    case 'cart-remove': ui.sale.cart = ui.sale.cart.filter(c => c.productId !== id); render(); break;
    case 'cart-inc': {
      const data = loadData();
      const item = ui.sale.cart.find(c => c.productId === id);
      if (!item) return;
      const available = productStock(data, id);
      if (item.qty + 1 > available) return toast('Only ' + available + ' non-expired unit(s) available.', 'error');
      item.qty += 1;
      render();
      break;
    }
    case 'cart-dec': {
      const item = ui.sale.cart.find(c => c.productId === id);
      if (!item) return;
      if (item.qty > 1) item.qty -= 1;
      else ui.sale.cart = ui.sale.cart.filter(c => c.productId !== id);
      render();
      break;
    }
    case 'sale-complete': completeSale(); break;
    case 'sale-view': openReceipt(id); break;
    case 'sale-void': voidSale(id); break;
    case 'print-receipt': window.print(); break;

    /* ---- Stock ---- */
    case 'stock-tab':
      ui.stockTab = el.dataset.tab;
      if (ui.stockTab !== 'writeoff') { ui.woSearch = ''; ui.woBatchId = ''; }
      render();
      break;
    case 'wo-select': ui.woBatchId = id; render(); break;
    case 'writeoff-expired': {
      const data = loadData();
      const expired = data.batches.filter(b => b.quantity > 0 && expiryStatus(b.expiry_date).key === 'expired');
      if (!expired.length) return toast('There is no expired stock to write off.', 'info');
      const totalUnits = expired.reduce((sum, b) => sum + b.quantity, 0);
      const totalValue = expired.reduce((sum, b) => { const p = data.P[b.product_id]; return sum + b.quantity * Number(p ? p.price : 0); }, 0);
      confirmDialog(
        'Write off ' + expired.length + ' expired batch(es) · ' + totalUnits + ' unit(s) · total value ' + money(totalValue) + '? This cannot be undone.',
        () => {
          try {
            db.transaction(state => {
              const now = new Date().toISOString();
              state.batches.forEach(batch => {
                if (batch.quantity > 0 && expiryStatus(batch.expiry_date).key === 'expired') {
                  const qty = batch.quantity;
                  batch.quantity = 0;
                  db.insertInto(state, 'movements', {
                    batch_id: batch.id, type:'written_off', quantity: qty, reason: 'Expired',
                    from_slot_id: batch.slot_id, to_slot_id: null, created_at: now
                  });
                }
              });
            });
            toast('Expired stock written off.', 'success');
            render();
          } catch (err) { toast(err.message, 'error'); }
        }, { title: 'Write off expired stock', confirmText: 'Write off' }
      );
      break;
    }

    /* ---- Storage ---- */
    case 'storage-new': openStorageModal(null); break;
    case 'storage-edit': openStorageModal(id); break;
    case 'storage-view': openStorageContents(id); break;
    case 'storage-save': {
      clearFieldErrors();
      const name = $('#stName').value.trim();
      const area = $('#stArea').value.trim();
      const type = $('#stType').value;
      if (!name) { setFieldError('stName','Storage name is required.'); document.getElementById('stName').focus(); return; }
      let slotLabels = [];
      if (!id) {
        slotLabels = ($('#stSlots').value || '').split(',').map(s => s.trim()).filter(Boolean);
        if (slotLabels.length === 0) {
          setFieldError('stSlots', 'Add at least one slot — you need a slot to receive stock.');
          const f = document.getElementById('stSlots');
          if (f) f.focus();
          return;
        }
      }
      try {
        if (id) db.update('storages', id, { name, area, type });
        else {
          db.transaction(state => {
            const storage = db.insertInto(state, 'storages', { name, area, type });
            slotLabels.forEach(label => db.insertInto(state, 'slots', { storage_id: storage.id, label }));
          });
        }
        closeModal();
        toast('Storage saved.', 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'storage-del': {
      const data = loadData();
      const storage = data.S[id];
      if (!storage) return;
      const slotIds = data.slots.filter(s => s.storage_id === id).map(s => s.id);
      const holding = data.batches.filter(b => b.quantity > 0 && slotIds.includes(b.slot_id));
      if (holding.length) {
        confirmDialog(
          '"' + storage.name + '" still holds ' + holding.length + ' batch(es) of stock. Move the contents somewhere else first.',
          () => openRearrange(),
          { title: 'Storage not empty', confirmText: 'Rearrange contents', danger: false }
        );
        return;
      }
      confirmDialog('Delete storage "' + storage.name + '" and its ' + slotIds.length + ' slot(s)?', () => {
        try {
          db.transaction(state => {
            state.slots = state.slots.filter(s => s.storage_id !== id);
            state.storages = state.storages.filter(s => s.id !== id);
            state.batches.forEach(b => { if (slotIds.includes(b.slot_id)) b.slot_id = null; });
          });
          toast('Storage deleted.', 'success');
          render();
        } catch (err) { toast(err.message, 'error'); }
      }, { title: 'Delete storage', confirmText: 'Delete' });
      break;
    }
    case 'slot-add': {
      const data = loadData();
      const label = ($('#newSlotLabel').value || '').trim();
      if (!label) { toast('Slot label is required.', 'error'); return; }
      const dup = data.slots.some(s => s.storage_id === id && s.label.toLowerCase() === label.toLowerCase());
      if (dup) return toast('That slot already exists in this storage.', 'error');
      const draft = { name: $('#stName').value, area: $('#stArea').value, type: $('#stType').value };
      try {
        db.add('slots', { storage_id: id, label });
        render();
        openStorageModal(id, draft);
        toast('Slot added.', 'success');
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'slot-del': {
      const data = loadData();
      const slot = data.SL[id];
      if (!slot) return;
      const holding = data.batches.filter(b => b.slot_id === id && b.quantity > 0);
      if (holding.length) return toast('This slot still holds stock. Use "Rearrange contents" to move it first.', 'error');
      const draft = { name: $('#stName').value, area: $('#stArea').value, type: $('#stType').value };
      try {
        db.transaction(state => {
          state.slots = state.slots.filter(s => s.id !== id);
          state.batches.forEach(b => { if (b.slot_id === id) b.slot_id = null; });
        });
        render();
        openStorageModal(el.dataset.storage, draft);
        toast('Slot removed.', 'success');
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'rearrange-open': openRearrange(); break;
    case 'rearrange-mode': rearrangeState.mode = el.dataset.mode; renderRearrangeBody(); break;
    case 'rearrange-confirm': confirmRearrange(); break;
    case 'go-stock': ui.tab = 'stock'; ui.stockTab = 'receive'; render(); blinkTab('stock'); break;
    case 'export-csv': exportHistoryCSV(); break;

    /* ---- Settings ---- */
    case 'settings-save': {
      clearFieldErrors();
      const name = $('#setPharmName').value.trim();
      const address = $('#setPharmAddress').value.trim();
      const phone = $('#setPharmPhone').value.trim();
      const symbol = $('#setCurrencySymbol').value.trim();
      const username = $('#setUsername').value.trim();
      const password = $('#setPassword').value;
      const passwordConfirm = $('#setPasswordConfirm').value;
      const currentPassword = $('#setCurrentPassword').value;
      let bad = false;
      if (!name) { setFieldError('setPharmName','Pharmacy name is required.'); bad = true; }
      if (!symbol) { setFieldError('setCurrencySymbol','Currency symbol is required.'); bad = true; }
      const wantsAuthChange = !!(username || password || passwordConfirm || currentPassword);
      if (wantsAuthChange) {
        if (!username) { setFieldError('setUsername','Username is required to change the password.'); bad = true; }
        if (!password) { setFieldError('setPassword','Password is required.'); bad = true; }
        if (password && !passwordConfirm) { setFieldError('setPasswordConfirm','Please confirm the password.'); bad = true; }
        if (password && passwordConfirm && password !== passwordConfirm) { setFieldError('setPasswordConfirm','Passwords do not match.'); bad = true; }
        if (isAuthEnabled()) {
          const auth = getAuth();
          if (!currentPassword) { setFieldError('setCurrentPassword','Current password is required.'); bad = true; }
          else if (!auth || hashAuth(currentPassword) !== auth.passHash) { setFieldError('setCurrentPassword','Current password is incorrect.'); bad = true; }
        }
      }
      if (bad) { focusFirstInvalid(); return; }
      try {
        db.transaction(state => {
          state.settings = Object.assign({}, state.settings, {
            pharmacy_name: name, pharmacy_address: address, pharmacy_phone: phone, currency_symbol: symbol
          });
          state.meta = Object.assign({}, state.meta || {}, { onboarded: true });
        });
        if (wantsAuthChange) {
          saveAuth(username, password);
          clearSession();
          showAuthScreen();
          toast('Credentials updated. Please log in again.', 'success');
        } else {
          toast('Settings saved.', 'success');
          render();
        }
      } catch (err) { toast(err.message, 'error'); }
      break;
    }
    case 'settings-remove-logo':
      try {
        db.transaction(state => { state.settings = Object.assign({}, state.settings, { logo_data_url: '' }); });
        toast('Logo removed.', 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
      break;
  }
}

function closeDataMenu() {
  const m = $('#dataMenu');
  const b = $('#dataMenuBtn');
  if (m) m.hidden = true;
  if (b) b.setAttribute('aria-expanded', 'false');
}

document.addEventListener('input', event => {
  const t = event.target;
  switch (t.id) {
    case 'productSearch': ui.productSearch = t.value; renderKeepFocus(); break;
    case 'invSearch': ui.inv.search = t.value; renderKeepFocus(); break;
    case 'saleSearch': ui.sale.search = t.value; renderKeepFocus(); break;
    case 'cashInput': ui.sale.cash = t.value; updateSaleCashUI(); break;
    case 'histSearch': ui.history.search = t.value; ui.history.page = 1; renderKeepFocus(); break;
    case 'rearrangeReason': rearrangeState.reason = t.value; break;
    case 'woQty': ui.woQty = t.value; break;
    case 'woNote': ui.woNote = t.value; break;
    case 'setCurrencySymbol': {
      const val = t.value;
      const previewEl = $('#currencyPreview');
      if (previewEl) previewEl.textContent = (val || '$') + '1,234.56';
      const preset = $('#setCurrencyPreset');
      if (preset) {
        const common = ['$','₱','€','£','¥','₹','₩','₪'];
        preset.value = common.includes(val) ? val : 'custom';
      }
      break;
    }
  }
});

document.addEventListener('keydown', event => {
  if (event.target.id === 'saleSearch' && event.key === 'Enter') {
    event.preventDefault();
    const q = ui.sale.search.trim().toLowerCase();
    if (!q) return;
    const data = loadData();
    const first = data.products.find(p => [p.brand_name, p.generic_name, p.strength].join(' ').toLowerCase().includes(q) && productStock(data, p.id) > 0);
    if (!first) return;
    const existing = ui.sale.cart.find(c => c.productId === first.id);
    const already = existing ? existing.qty : 0;
    if (already + 1 > productStock(data, first.id)) { toast('Only ' + productStock(data, first.id) + ' non-expired unit(s) available.', 'error'); return; }
    if (existing) existing.qty += 1;
    else ui.sale.cart.push({ productId: first.id, qty: 1 });
    ui.sale.search = '';
    render();
  }
});

document.addEventListener('change', event => {
  const t = event.target;
  const rf = t.closest('[data-rf]');
  if (rf) {
    const field = rf.dataset.rf;
    if (field.startsWith('manual:')) rearrangeState.manualMap[field.slice(7)] = rf.value;
    else if (field === 'pickPickStorageId') { rearrangeState.pickPickStorageId = rf.value; rearrangeState.pickSlotId = ''; }
    else {
      rearrangeState[field] = rf.value;
      if (field === 'toId') { rearrangeState.singleSlotId = ''; rearrangeState.manualMap = {}; }
      if (field === 'fromId') rearrangeState.manualMap = {};
      if (field === 'pickSourceId') { rearrangeState.pickBatchIds = []; rearrangeState.pickSlotId = ''; }
    }
    renderRearrangeBody();
    return;
  }
  const cb = t.closest('[data-rf-batch]');
  if (cb) {
    const batchId = cb.dataset.rfBatch;
    const list = rearrangeState.pickBatchIds;
    const idx = list.indexOf(batchId);
    if (cb.checked && idx === -1) list.push(batchId);
    if (!cb.checked && idx !== -1) list.splice(idx, 1);
    renderRearrangeBody();
    return;
  }
  if (t.id === 'invStatus')  { ui.inv.status = t.value; render(); return; }
  if (t.id === 'invStorage') { ui.inv.storage = t.value; render(); return; }
  if (t.id === 'invSort')    { ui.inv.sort = t.value; render(); return; }
  if (t.id === 'invShowZero'){ ui.inv.showZero = t.checked; render(); return; }
  if (t.id === 'histType') { ui.history.type = t.value; ui.history.page = 1; render(); return; }
  if (t.id === 'histFrom') { ui.history.from = t.value; ui.history.page = 1; render(); return; }
  if (t.id === 'histTo')   { ui.history.to = t.value; ui.history.page = 1; render(); return; }
  if (t.id === 'woReason') { ui.woReason = t.value; return; }
  if (t.id === 'setCurrencyPreset' && t.value !== 'custom') {
    const sym = $('#setCurrencySymbol');
    if (sym) {
      sym.value = t.value;
      const previewEl = $('#currencyPreview');
      if (previewEl) previewEl.textContent = t.value + '1,234.56';
    }
  }
  if (t.id === 'setPharmLogo' && t.files && t.files[0]) {
    const file = t.files[0];
    if (file.size > 500 * 1024) { toast('Logo must be under 500 KB.', 'error'); t.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        db.transaction(state => { state.settings = Object.assign({}, state.settings, { logo_data_url: String(reader.result) }); });
        toast('Logo saved.', 'success');
        render();
      } catch (err) { toast(err.message, 'error'); }
    };
    reader.onerror = () => toast('Could not read the image.', 'error');
    reader.readAsDataURL(file);
  }
});

(function initTabTooltips() {
  const tip = document.createElement('div');
  tip.className = 'tab-tooltip';
  tip.setAttribute('role', 'tooltip');
  document.body.appendChild(tip);
  function show(btn) {
    const text = btn.getAttribute('data-tip');
    if (!text) return;
    tip.textContent = text;
    tip.classList.add('show');
    const tr = tip.getBoundingClientRect();
    const r = btn.getBoundingClientRect();
    const isMobile = window.innerWidth <= 720;
    let left, top;
    if (isMobile) { left = r.left + r.width / 2 - tr.width / 2; top = r.top - tr.height - 8; }
    else { left = r.right + 8; top = r.top + r.height / 2 - tr.height / 2; }
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - tr.height - 8));
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hide() { tip.classList.remove('show'); }
  $$('#tabs .tab').forEach(btn => {
    btn.addEventListener('mouseenter', () => show(btn));
    btn.addEventListener('mouseleave', hide);
    btn.addEventListener('focus', () => show(btn));
    btn.addEventListener('blur', hide);
  });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
})();

$('#headerNotifBtn').addEventListener('click', () => {
  const data = loadData();
  const expired = data.batches.filter(b => b.quantity > 0 && expiryStatus(b.expiry_date).key === 'expired');
  const soon = data.batches.filter(b => { const d = daysUntil(b.expiry_date); return b.quantity > 0 && d !== null && d >= 0 && d <= 30; });
  const low = data.products.filter(p => productStock(data, p.id) < Number(p.min_stock));
  if (!expired.length && !soon.length && !low.length) toast('All clear! No urgent alerts right now.', 'success');
  else {

function completeSale() {
  const data = loadData();
  if (!ui.sale.cart.length) return toast('Cart is empty.', 'error');
  const plan = [];
  let total = 0;
  for (const item of ui.sale.cart) {
    const product = data.P[item.productId];
    if (!product) return toast('A product in the cart no longer exists.', 'error');
    const { allocations, missing } = allocateFEFO(data, item.productId, item.qty);
    if (missing > 0) return toast('Not enough non-expired stock for ' + product.brand_name + ' (short by ' + missing + ').', 'error');
    total += item.qty * Number(product.price);
    allocations.forEach(a => plan.push({ productId: product.id, batchId: a.batchId, qty: a.qty, unitPrice: Number(product.price) }));
  }
  total = round2(total);
  const cash = round2(Number(ui.sale.cash || 0));
  if (!(cash >= total)) return toast('Cash received must cover the total of ' + money(total) + '.', 'error');
  let saleId = null;
  try {
    saleId = db.transaction(state => {
      for (const line of plan) {
        const batch = state.batches.find(b => b.id === line.batchId);
        if (!batch) throw new Error('A batch disappeared — please retry.');
        if (batch.quantity < line.qty) throw new Error('Stock changed while selling — please retry.');
        if (expiryStatus(batch.expiry_date).key === 'expired') throw new Error('Batch ' + batch.batch_no + ' expired — please retry.');
      }
      const seq = state.meta.receipt_seq || 1;
      const receiptNo = 'S-' + String(seq).padStart(4, '0');
      state.meta.receipt_seq = seq + 1;
      const sale = db.insertInto(state, 'sales', {
        receipt_no: receiptNo, total: total, cash_received: cash, status: 'completed', created_at: new Date().toISOString()
      });
      plan.forEach(line => {
        const batch = state.batches.find(b => b.id === line.batchId);
        batch.quantity -= line.qty;
        db.insertInto(state, 'sale_items', {
          sale_id: sale.id, product_id: line.productId, batch_id: line.batchId,
          quantity: line.qty, unit_price: line.unitPrice
        });
        db.insertInto(state, 'movements', {
          batch_id: batch.id, type:'sold', quantity: line.qty, reason: 'Sale ' + receiptNo,
          from_slot_id: batch.slot_id, to_slot_id: null, created_at: sale.created_at
        });
      });
      return sale.id;
    });
  } catch (err) { return toast(err.message, 'error'); }
  ui.sale.cart = []; ui.sale.cash = '';
  render();
  openReceipt(saleId);
  toast('Sale completed.', 'success');
}

function openReceipt(saleId) {
  const data = loadData();
  const sale = data.sales.find(s => s.id === saleId);
  if (!sale) return;
  const s = getSettings();
  const items = data.saleItems.filter(i => i.sale_id === saleId);
  const change = Number(sale.cash_received) - Number(sale.total);
  const rows = items.map(it => {
    const p = data.P[it.product_id] || { brand_name:'(deleted product)', strength:'' };
    const b = data.B[it.batch_id];
    return '<tr>' +
      '<td>' + esc(p.brand_name) + ' ' + esc(p.strength) + '<br><span class="muted small">batch ' + esc(b ? b.batch_no : '—') + '</span></td>' +
      '<td class="right">' + it.quantity + '</td>' +
      '<td class="right">' + money(it.unit_price) + '</td>' +
      '<td class="right">' + money(it.quantity * it.unit_price) + '</td></tr>';
  }).join('');
  const logoHtml = s.logo_data_url ? '<img src="' + esc(s.logo_data_url) + '" alt="Pharmacy logo" class="receipt-logo">' : '';
  const addrHtml = s.pharmacy_address ? '<div class="muted small" style="color:#64748B;">' + esc(s.pharmacy_address) + '</div>' : '';
  const phoneHtml = s.pharmacy_phone ? '<div class="muted small" style="color:#64748B;">Tel: ' + esc(s.pharmacy_phone) + '</div>' : '';
  const body =
    '<div id="receiptPrintArea" class="receipt">' +
      '<div class="receipt-head">' + logoHtml +
        '<strong style="font-size:1.15rem;">' + esc(s.pharmacy_name || 'Pharmacy') + '</strong>' +
        addrHtml + phoneHtml + '</div>' +
      '<div class="receipt-meta"><span>Receipt</span><span>' + esc(sale.receipt_no) + '</span></div>' +
      '<div class="receipt-meta"><span>Date</span><span>' + esc(fmtDateTime(sale.created_at)) + '</span></div>' +
      '<div class="receipt-meta"><span>Status</span><span>' + esc(String(sale.status).toUpperCase()) + '</span></div>' +
      '<table class="receipt-table"><thead><tr><th>Item</th><th class="right">Qty</th>' +
        '<th class="right">Price</th><th class="right">Amount</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="receipt-meta" style="border-bottom:none; margin-top:12px;"><span style="font-weight:700;">TOTAL</span><strong style="font-size:1.1rem;">' + money(sale.total) + '</strong></div>' +
      '<div class="receipt-meta" style="border-bottom:none; padding-top:2px;"><span class="muted">Cash</span><span>' + money(sale.cash_received) + '</span></div>' +
      '<div class="receipt-meta" style="border-bottom:none; padding-top:2px;"><span class="muted">Change</span><span>' + money(change) + '</span></div>' +
      '<p class="center muted small" style="margin-top:16px; color:#64748B;">Thank you for your visit!</p>' +
    '</div>';
  openModal({
    title: 'Receipt ' + sale.receipt_no, body,
    footer:
      '<button class="btn" data-act="modal-close" type="button">Close</button>' +
      '<button class="btn primary" data-act="print-receipt" type="button"><i class="ph ph-printer"></i> Print</button>'
  });
}

function voidSale(saleId) {
  const data = loadData();
  const sale = data.sales.find(s => s.id === saleId);
  if (!sale || sale.status !== 'completed') return toast('This sale cannot be voided.', 'error');
  confirmDialog('Void ' + sale.receipt_no + '? All quantities go back to the original batches.', () => {
    try {
      db.transaction(state => {
        const target = state.sales.find(s => s.id === saleId);
        if (!target || target.status !== 'completed') throw new Error('Sale cannot be voided.');
        const items = state.sale_items.filter(i => i.sale_id === saleId);
        const now = new Date().toISOString();
        items.forEach(item => {
          const batch = state.batches.find(b => b.id === item.batch_id);
          if (!batch) throw new Error('Original batch no longer exists — cannot void.');
          batch.quantity += item.quantity;
          db.insertInto(state, 'movements', {
            batch_id: batch.id, type:'voided', quantity: item.quantity,
            reason: 'Void ' + target.receipt_no, from_slot_id: null, to_slot_id: batch.slot_id, created_at: now
          });
        });
        target.status = 'voided';
      });
      toast('Sale voided.', 'success');
      render();
    } catch (err) { toast(err.message, 'error'); }
  }, { title: 'Void sale', confirmText: 'Void sale' });
}

function confirmRearrange() {
  const data = loadData();
  const plan = buildRearrangePlan(data);
  if (plan.error) return toast(plan.error, 'error');
  if (!plan.rows.length) return toast('Nothing to move.', 'error');
  const reason = (rearrangeState.reason || '').trim();
  if (!reason) return toast('A reason is required for the move.', 'error');
  try {
    db.transaction(state => {
      const now = new Date().toISOString();
      plan.rows.forEach(row => {
        const batch = state.batches.find(b => b.id === row.batchId);
        if (!batch) throw new Error('A batch disappeared — please retry.');
        const fromSlot = batch.slot_id;
        batch.slot_id = row.toSlotId;
        db.insertInto(state, 'movements', {
          batch_id: batch.id, type:'moved', quantity: batch.quantity,
          reason: reason, from_slot_id: fromSlot, to_slot_id: row.toSlotId, created_at: now
        });
      });
    });
    closeModal();
    toast('Moved ' + plan.rows.length + ' batch(es).', 'success');
    render();
  } catch (err) { toast(err.message, 'error'); }
}

function exportBackup() {
  try {
    db.transaction(state => { state.meta = Object.assign({}, state.meta || {}, { last_export: new Date().toISOString() }); });
    const blob = new Blob([db.exportJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pharmacy-backup-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Backup exported.', 'success');
    render();
  } catch (err) { toast('Could not export backup.', 'error'); }
}

$('#importFile').addEventListener('change', event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result);
    let parsed;
    try { parsed = JSON.parse(text); validateBackup(parsed); }
    catch (err) { toast(err.message || 'Import failed.', 'error'); event.target.value = ''; return; }
    confirmDialog('This replaces ALL current data. Continue?', () => {
      try {
        db.importJSON(text);
        ui.sale.cart = []; ui.sale.cash = '';
        toast('Backup imported.', 'success');
        render();
      } catch (err) { toast(err.message || 'Import failed.', 'error'); }
    }, { title: 'Import backup', confirmText: 'Replace all data' });
    event.target.value = '';
  };
  reader.onerror = () => toast('Could not read the file.', 'error');
  reader.readAsText(file);
  event.target.value = '';
});

function exportHistoryCSV() {
  const data = loadData();
  const f = ui.history;
  const q = f.search.trim().toLowerCase();
  let rows = data.movements.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (f.type !== 'all') rows = rows.filter(m => m.type === f.type);
  if (f.from) rows = rows.filter(m => String(m.created_at).slice(0, 10) >= f.from);
  if (f.to)   rows = rows.filter(m => String(m.created_at).slice(0, 10) <= f.to);
  if (q) {
    rows = rows.filter(m => {
      const batch = data.B[m.batch_id];
      const product = batch ? data.P[batch.product_id] : null;
      const productName = batch ? (product ? product.brand_name : '(deleted product)') : '(deleted batch)';
      return [productName, batch ? batch.batch_no : '', m.reason || ''].join(' ').toLowerCase().includes(q);
    });
  }
  const csvCell = value => {
    let str = String(value == null ? '' : value);
    if (/^[=+\-@]/.test(str)) str = "'" + str;
    return '"' + str.replace(/"/g, '""') + '"';
  };
  const lines = [['Date/time (local)','Product','Batch','Type','Quantity','From slot','To slot','Reason'].map(csvCell).join(',')];
  rows.forEach(m => {
    const batch = data.B[m.batch_id];
    const product = batch ? data.P[batch.product_id] : null;
    const productName = batch ? (product ? product.brand_name + ' ' + product.strength : '(deleted product)') : '(deleted batch)';
    lines.push([
      fmtDateTime(m.created_at), productName, batch ? batch.batch_no : '—',
      MOVEMENT_LABELS[m.type] || 'Unknown', m.quantity,
      m.from_slot_id ? slotFullLabel(data, m.from_slot_id) : '',
      m.to_slot_id ? slotFullLabel(data, m.to_slot_id) : '',
      m.reason || ''
    ].map(csvCell).join(','));
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'history-' + todayISO() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('CSV exported (' + rows.length + ' rows).', 'success');
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = $('#themeToggle');
  if (btn) {
    btn.innerHTML = theme === 'dark'
      ? '<i class="ph ph-sun"></i><span class="btn-label">Light</span>'
      : '<i class="ph ph-moon"></i><span class="btn-label">Dark</span>';
  }
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (err) {}
}

(function boot() {
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch (err) {}
  applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
  db.init();
  initAuthForms();
  if (!isAuthEnabled() || !isSessionValid()) showAuthScreen();
  else hideAuthScreen();
})();
